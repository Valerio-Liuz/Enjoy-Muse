<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enjoy Muse</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="auth" hidden>
  <form id="af">
    <h1>Enjoy Muse</h1>
    <div id="atitle" style="font-weight:600"></div>
    <input type="text" id="un" placeholder="Username (3–20 karakter)" minlength="3" maxlength="20" autocomplete="username" hidden>
    <input type="email" id="em" placeholder="Email" autocomplete="email" required>
    <input type="password" id="pw" placeholder="Password (min. 6 karakter)" autocomplete="current-password" minlength="6">
    <button class="btn" id="abtn"></button>
    <div id="msg"></div>
    <div id="alinks"></div>
  </form>
</div>

<div id="app" hidden>
  <header><b>Enjoy Muse</b><div><span id="hello" style="color:var(--mute);margin-right:8px"></span><button onclick="sb.auth.signOut()">Keluar</button></div></header>
  <div class="body">
    <aside id="nav"></aside>
    <main>
      <div class="bar">
        <h2 id="vt"></h2>
        <button class="ghost" id="addsong" hidden onclick="openAddSongs()">＋ Tambah lagu</button>
        <button id="delpl" hidden onclick="delPlaylist()">Hapus playlist</button>
        <button class="btn" id="upbtn" onclick="openUpload()">Unggah lagu</button>
      </div>
      <div id="list"></div>
    </main>
  </div>
  <footer id="pbar" hidden>
    <div id="np">Belum ada lagu diputar</div>
    <div class="seek"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="0" step="1" value="0" aria-label="Posisi lagu"><span id="dur">0:00</span></div>
    <div class="ctl">
      <button id="shuf" onclick="toggleShuffle()" title="Acak" aria-label="Acak">🔀</button>
      <button onclick="prev()" aria-label="Sebelumnya">⏮</button>
      <button class="go" id="pp" onclick="toggle()" aria-label="Putar atau jeda">▶</button>
      <button onclick="next()" aria-label="Berikutnya">⏭</button>
      <button onclick="stopBtn()" title="Berhenti" aria-label="Berhenti">⏹</button>
    </div>
  </footer>
</div>
<dialog id="edd">
  <h3>Ubah lagu</h3>
  <div style="display:grid;gap:10px">
    <label class="fld" for="etitle">Judul Lagu<input type="text" id="etitle" maxlength="120"></label>
    <label class="fld" for="eartist">Penyanyi<input type="text" id="eartist" maxlength="80"></label>
  </div>
  <div class="dact"><button onclick="$('edd').close()">Batal</button><button class="btn" onclick="saveEdit()">Simpan</button></div>
</dialog>
<dialog id="asd">
  <h3>Tambah ke “<span id="asn"></span>”</h3>
  <div id="asl"></div>
  <div class="dact"><button onclick="$('asd').close()">Batal</button><button class="btn" id="asgo" onclick="doAddSongs()">Tambahkan</button></div>
</dialog>
<dialog id="upd">
  <h3>Unggah lagu</h3>
  <label class="btn" style="cursor:pointer;display:inline-block">Pilih file<input type="file" id="pick" accept="audio/*" multiple hidden></label>
  <div id="stg"></div>
  <div class="dact"><button onclick="closeUpload(true)">Batal</button><button class="btn" id="go" onclick="doUpload()">Unggah</button></div>
</dialog>
<audio id="au"></audio>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
